<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MY SIMPLE GACHA</title>
  <link rel="stylesheet" href="fonts/dotgothic16.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-screen="setup">
  <main>
    <section id="setup-screen" class="screen">
      <div class="setup-head">
        <canvas id="setup-teacher" aria-hidden="true"></canvas>
        <h1 class="logo">MY SIMPLE GACHA</h1>
      </div>
      <fieldset class="mode">
        <legend>抽籤方式</legend>
        <label><input type="radio" name="mode" value="group" checked> 抽組</label>
        <label><input type="radio" name="mode" value="person"> 抽個人</label>
      </fieldset>
      <div class="setup-grid">
        <div class="field">
          <div class="field-head">
            <h2>名單</h2>
            <button id="paste-toggle" type="button" class="small" aria-expanded="false">從 LINE／Excel 貼上</button>
          </div>
          <div class="saves">
            <select id="roster-select" aria-label="已存的名單"></select>
            <button id="roster-save" type="button" class="small">💾 存成…</button>
            <button id="roster-delete" type="button" class="small" disabled>🗑 刪除</button>
          </div>
          <p id="roster-note" class="saves-note" aria-live="polite"></p>
          <div id="paste-panel" class="paste-panel" hidden>
            <label for="paste-text">把 LINE 記事本的留言，或從 Excel 複製的格子（姓名、組別，可以有學號欄）貼在這裡</label>
            <textarea id="paste-text" rows="6" placeholder="第1組 王小明&#10;李大華 1組&#10;3 陳美美"></textarea>
            <button id="paste-apply" type="button" class="small primary">填入表格</button>
            <p id="paste-result" class="paste-result" aria-live="polite"></p>
          </div>
          <table class="grid">
            <thead><tr><th>姓名</th><th class="num">組別</th><th class="del"><span class="sr-only">刪除</span></th></tr></thead>
            <tbody id="roster-body"></tbody>
          </table>
          <button id="roster-add" type="button" class="small">＋ 新增一列</button>
          <div id="preview" class="preview" aria-live="polite"></div>
        </div>
        <div class="field">
          <div class="field-head"><h2>任務</h2></div>
          <div class="saves">
            <select id="tasks-select" aria-label="已存的任務"></select>
            <button id="tasks-save" type="button" class="small">💾 存成…</button>
            <button id="tasks-delete" type="button" class="small" disabled>🗑 刪除</button>
          </div>
          <p id="tasks-note" class="saves-note" aria-live="polite"></p>
          <table class="grid">
            <thead><tr><th>任務</th><th class="num">數量</th><th class="del"><span class="sr-only">刪除</span></th></tr></thead>
            <tbody id="tasks-body"></tbody>
          </table>
          <button id="tasks-add" type="button" class="small">＋ 新增一列</button>
        </div>
      </div>
      <ul id="messages" class="messages"></ul>
      <p id="resume-note" class="resume-note" hidden></p>
      <div class="start-actions">
        <button id="start" type="button" class="primary" disabled><span class="arrow" aria-hidden="true">▶</span> 開始抽籤</button>
        <button id="resume" type="button" class="primary" hidden><span class="arrow" aria-hidden="true">▶</span> 繼續抽籤</button>
        <button id="restart" type="button" hidden>↻ 重新開始</button>
        <button id="clear-all" type="button" class="danger">✖ 全部清除</button>
      </div>
    </section>

    <section id="draw-screen" class="screen" hidden>
      <div class="draw-layout">
        <div class="draw-main">
          <button id="to-setup" type="button" class="to-setup" title="回到設定（Esc）">◀ 設定</button>
          <button id="mute" type="button" class="mute" aria-pressed="false">🔊 音效</button>
          <p id="progress" class="progress"></p>
          <h2 id="task-title" class="task-title"></h2>
          <p id="task-count" class="task-count"></p>
          <div id="gacha"></div>
          <ul id="opened" class="opened" aria-label="這個任務已抽出"></ul>
          <p id="shortfall" class="shortfall" hidden></p>
          <div class="actions">
            <button id="draw" type="button" class="primary">抽！</button>
            <button id="next" type="button" class="primary" hidden>下一個任務</button>
          </div>
        </div>
        <aside class="draw-side">
          <h3>任務順序</h3>
          <p class="order-hint">還沒抽的任務可以拖動 ⠿ 或按 ▲▼ 調整順序</p>
          <ol id="order" class="order"></ol>
          <h3>已分配</h3>
          <ol id="results" class="results"></ol>
          <h3>尚未抽到（<span id="remaining-count">0</span>）</h3>
          <ul id="remaining" class="chips"></ul>
        </aside>
      </div>
    </section>

    <section id="summary-screen" class="screen" hidden>
      <h2>分配結果</h2>
      <table class="summary">
        <thead><tr><th>任務</th><th>抽中</th><th>說明</th></tr></thead>
        <tbody id="summary-body"></tbody>
      </table>
      <div class="actions">
        <button id="redraw" type="button" class="primary">重新抽</button>
        <button id="back" type="button">回到設定</button>
      </div>
    </section>
  </main>
  <dialog id="confirm" class="pixel-dialog">
    <p id="confirm-text"></p>
    <div class="actions">
      <button id="confirm-no" type="button">取消</button>
      <button id="confirm-yes" type="button" class="primary">確定</button>
    </div>
  </dialog>
  <dialog id="name-dialog" class="pixel-dialog">
    <label id="name-text" for="name-input"></label>
    <input id="name-input" type="text" maxlength="30" autocomplete="off">
    <div class="actions">
      <button id="name-no" type="button">取消</button>
      <button id="name-yes" type="button" class="primary">存檔</button>
    </div>
  </dialog>
  <script src="src/parse.js"></script>
  <script src="src/draw.js"></script>
  <script src="src/store.js"></script>
  <script src="src/sfx.js"></script>
  <script src="src/gacha.js"></script>
  <script src="src/teacher.js"></script>
  <script src="src/app.js"></script>
</body>
</html>
